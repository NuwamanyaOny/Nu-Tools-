<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f0f4ff;--surface:#ffffff;--card:#ffffff;--border:#dde3f0;--border2:#c5cfe0;
  --glow:#2563eb;--glowsoft:rgba(37,99,235,0.1);--accent:#7c3aed;--cyan:#0891b2;
  --green:#059669;--text:#0f172a;--muted:#475569;--faint:#e8edf5;
  --tool-name:#0f172a;--hero-white:#0f172a;--yt-title:#0f172a;--modal-desc:#475569;
  --badge-new-bg:rgba(5,150,105,0.1);--badge-new-color:#059669;--badge-new-border:rgba(5,150,105,0.3);
  --badge-hot-bg:rgba(220,38,38,0.1);--badge-hot-color:#dc2626;--badge-hot-border:rgba(220,38,38,0.3);
  --badge-free-bg:rgba(8,145,178,0.1);--badge-free-color:#0891b2;--badge-free-border:rgba(8,145,178,0.3);
  --hero-pill-color:#059669;--hero-pill-bg:rgba(5,150,105,0.08);--hero-pill-border:rgba(5,150,105,0.25);
  --card-hover-shadow:0 12px 36px rgba(0,0,0,0.12),0 0 0 1px var(--border2);
  --featured-bg:linear-gradient(135deg,#e8f0ff,#f0e8ff);--featured-border:#b8c8f0;
}
body.dark{
  --bg:#06090f;--surface:#0c1220;--card:#0f1826;--border:#1a2d4a;--border2:#243856;
  --glow:#2563eb;--glowsoft:rgba(37,99,235,0.18);--accent:#7c3aed;--cyan:#06b6d4;
  --green:#10b981;--text:#e2e8f0;--muted:#64748b;--faint:#1e293b;
  --tool-name:#f1f5f9;--hero-white:#f1f5f9;--yt-title:#f1f5f9;--modal-desc:#94a3b8;
  --badge-new-bg:rgba(16,185,129,0.12);--badge-new-color:#34d399;--badge-new-border:rgba(16,185,129,0.25);
  --badge-hot-bg:rgba(239,68,68,0.12);--badge-hot-color:#f87171;--badge-hot-border:rgba(239,68,68,0.25);
  --badge-free-bg:rgba(6,182,212,0.12);--badge-free-color:#22d3ee;--badge-free-border:rgba(6,182,212,0.25);
  --hero-pill-color:#34d399;--hero-pill-bg:rgba(16,185,129,0.08);--hero-pill-border:rgba(16,185,129,0.22);
  --card-hover-shadow:0 12px 36px rgba(0,0,0,0.4),0 0 0 1px var(--border2);
  --featured-bg:linear-gradient(135deg,#0d1f3c,#120d2a);--featured-border:#1e3a6e;
}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;min-height:100vh;overflow-x:hidden;scrollbar-width:none;-ms-overflow-style:none;}
html{scrollbar-width:none;-ms-overflow-style:none;}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(0.85)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* NAV */
nav{position:sticky;top:0;z-index:100;background:rgba(240,244,255,0.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:0 20px;height:62px;display:flex;align-items:center;justify-content:space-between;}
body.dark nav{background:rgba(6,9,15,0.85);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid rgba(37,99,235,0.5);background:linear-gradient(135deg,#1d4ed8,#7c3aed);display:grid;place-items:center;font-size:18px;color:#fff;font-weight:700;}
.nav-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--text);letter-spacing:0.5px;line-height:1.2;}
.nav-name span{color:#7c3aed;}
.nav-sub{display:block;font-size:10px;font-family:'Space Grotesk',sans-serif;font-weight:400;color:var(--muted);}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;padding:6px 12px;border-radius:7px;transition:color .2s,background .2s;white-space:nowrap;}
.nav-links a:hover{color:var(--text);background:var(--faint);}
.nav-cta{padding:7px 16px!important;background:var(--glowsoft)!important;border:1px solid rgba(37,99,235,0.4)!important;color:#2563eb!important;border-radius:8px!important;}
body.dark .nav-cta{color:#60a5fa!important;}

.nav-search-box{display:flex;align-items:center;gap:8px;background:var(--faint);border:1px solid var(--border);border-radius:10px;padding:8px 14px;flex:1;max-width:340px;margin:0 16px;cursor:pointer;transition:border-color .2s;}
.nav-search-box:hover{border-color:var(--border2);}
.nav-search-box .search-icon{color:var(--muted);font-size:14px;}
.nav-search-placeholder{color:var(--muted);font-size:13px;font-family:'Space Grotesk',sans-serif;}
@media(max-width:760px){
  .nav-search-box{flex:0;max-width:none;margin:0 8px;padding:8px;border-radius:50%;width:38px;height:38px;justify-content:center;}
  .nav-search-placeholder{display:none;}
}

/* MOBILE HAMBURGER MENU */
.mobile-menu-btn{display:none;background:var(--faint);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:8px;font-size:16px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;}
.nav-profile-btn{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ea580c);border:none;color:#fff;font-size:15px;cursor:pointer;display:grid;place-items:center;flex-shrink:0;}
.mobile-menu-overlay{position:fixed;inset:0;background:transparent;z-index:400;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.mobile-menu-overlay.show{opacity:1;pointer-events:all;}
.mobile-menu-panel{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:var(--surface);border-right:1px solid var(--border);z-index:401;transform:translateX(-100%);transition:transform .3s ease;padding:20px;overflow-y:auto;box-shadow:8px 0 30px rgba(0,0,0,0.15);}
body.dark .mobile-menu-panel{box-shadow:8px 0 30px rgba(0,0,0,0.5);}
.mobile-menu-panel.show{transform:translateX(0);}
.mobile-menu-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.mobile-menu-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;border:2px solid rgba(37,99,235,0.5);}
.mobile-menu-guest-name{font-size:15px;font-weight:700;color:var(--text);}
.mobile-menu-guest-sub{font-size:11.5px;color:var(--muted);line-height:1.4;}
.mobile-menu-close{background:var(--faint);border:1px solid var(--border);color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;display:grid;place-items:center;flex-shrink:0;margin-left:auto;}
.mobile-menu-links{display:flex;flex-direction:column;gap:2px;}
.mobile-menu-links a{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;padding:12px 10px;border-radius:10px;transition:background .2s;font-family:'Space Grotesk',sans-serif;}
.mobile-menu-links a:hover{background:var(--faint);}
.mobile-menu-divider{height:1px;background:var(--border);margin:10px 0;}
@media(max-width:480px){
  .mobile-menu-btn{display:flex;}
  .nav-profile-btn{display:none;}
}

.whatsapp-float{position:fixed;bottom:22px;right:20px;width:52px;height:52px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;font-size:26px;text-decoration:none;box-shadow:0 6px 20px rgba(0,0,0,0.25);z-index:200;transition:transform .2s ease;}
.whatsapp-float:hover{transform:scale(1.08);}
@media(max-width:480px){.whatsapp-float{bottom:16px;right:16px;width:48px;height:48px;font-size:23px;}}

/* COOKIE CONSENT BANNER */
.cookie-banner{position:fixed;bottom:0;left:0;right:0;z-index:900;background:var(--surface);border-top:1px solid var(--border2);padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;box-shadow:0 -8px 30px rgba(0,0,0,0.12);transform:translateY(110%);transition:transform .4s ease;}
body.dark .cookie-banner{box-shadow:0 -8px 30px rgba(0,0,0,0.4);}
.cookie-banner.show{transform:translateY(0);}
.cookie-text{font-size:12.5px;color:var(--muted);max-width:520px;line-height:1.5;}
.cookie-text a{color:#2563eb;text-decoration:underline;}
body.dark .cookie-text a{color:#60a5fa;}
.cookie-btns{display:flex;gap:8px;flex-shrink:0;}
.cookie-btn-accept{padding:9px 20px;border-radius:9px;border:none;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;white-space:nowrap;}
.cookie-btn-decline{padding:9px 16px;border-radius:9px;border:1px solid var(--border);background:var(--faint);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;white-space:nowrap;}
@media(max-width:480px){
  .cookie-banner{padding:14px 16px;justify-content:flex-start;}
  .cookie-btns{width:100%;}
  .cookie-btn-accept,.cookie-btn-decline{flex:1;}
}

/* HERO */
.hero{position:relative;z-index:1;text-align:center;padding:72px 20px 56px;animation:fadeUp .6s ease both;}
.hero-glow{display:none;}
.hero-pill{display:inline-flex;align-items:center;gap:7px;background:var(--hero-pill-bg);border:1px solid var(--hero-pill-border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:600;color:var(--hero-pill-color);margin-bottom:28px;letter-spacing:0.3px;}
.hero-pill-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite;flex-shrink:0;}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,7vw,52px);font-weight:900;line-height:1.08;letter-spacing:-0.5px;margin-bottom:8px;}
.hero h1 .white{color:var(--hero-white);}
.hero h1 .grad{background:linear-gradient(90deg,#3b82f6,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-sub{color:var(--muted);font-size:16px;max-width:440px;margin:14px auto 36px;line-height:1.65;font-weight:400;}
.hero-stats{display:inline-block;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:10px 20px;font-size:12px;font-weight:600;max-width:95vw;}
.hero-stats-row{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;}
.hero-stat-stack{display:flex;flex-direction:column;align-items:center;gap:2px;}
.hero-stat{display:flex;align-items:center;gap:5px;color:var(--muted);}
.hero-stat b{color:var(--text);}
.sep{color:var(--border2);margin:0 10px;}

/* TOOLBAR */
.toolbar{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 16px 32px;}
.search-row{display:flex;gap:10px;margin-bottom:14px;}
.search-box{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 16px;transition:border-color .2s,box-shadow .2s;}
.search-box:focus-within{border-color:var(--glow);box-shadow:0 0 0 3px rgba(37,99,235,0.12);}
.search-icon{color:var(--muted);font-size:16px;flex-shrink:0;}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Space Grotesk',sans-serif;font-weight:500;}
.search-box input::placeholder{color:var(--muted);font-weight:400;}
.clear-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px;display:none;line-height:1;}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat-pill{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif;white-space:nowrap;}
.cat-pill:hover{border-color:var(--border2);color:var(--text);}
.cat-pill.active{background:var(--glowsoft);border-color:rgba(37,99,235,0.5);color:#2563eb;}
body.dark .cat-pill.active{color:#60a5fa;}

/* SECTION */
.section-head{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;padding:0 16px 14px;max-width:680px;margin:0 auto;}
.section-label{font-size:11px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);}
.tool-count{font-size:12px;color:var(--muted);background:var(--faint);padding:3px 10px;border-radius:10px;}

/* GRID */
.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:0 16px 16px;max-width:680px;margin:0 auto;}
.tool-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;position:relative;transition:border-color .15s ease;animation:fadeUp .5s ease both;}
.tool-card:hover{border-color:var(--border2);}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.tool-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex-shrink:0;position:relative;}
.tool-icon::after{content:'';position:absolute;inset:0;border-radius:12px;border:1px solid rgba(0,0,0,0.06);}
body.dark .tool-icon::after{border-color:rgba(255,255,255,0.08);}
.badge{font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;padding:2px 6px;border-radius:5px;}
.badge-new{background:var(--badge-new-bg);color:var(--badge-new-color);border:1px solid var(--badge-new-border);}
.badge-hot{background:var(--badge-hot-bg);color:var(--badge-hot-color);border:1px solid var(--badge-hot-border);}
.badge-free{background:var(--badge-free-bg);color:var(--badge-free-color);border:1px solid var(--badge-free-border);}
.badge-vip{background:rgba(124,58,237,0.12);color:#7c3aed;border:1px solid rgba(124,58,237,0.3);}
body.dark .badge-vip{background:rgba(124,58,237,0.15);color:#c084fc;}
.tool-name{font-size:13.5px;font-weight:700;line-height:1.3;color:var(--tool-name);display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
.tool-dev{font-size:10.5px;color:var(--muted);margin-top:-3px;}
.dl-btn-mini{flex-shrink:0;padding:7px 14px;border-radius:9px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;transition:opacity .2s;}
.dl-btn-mini:hover{opacity:0.88;}
.dl-btn-mini.outline{background:transparent;color:#2563eb;border:1px solid rgba(37,99,235,0.35);}
body.dark .dl-btn-mini.outline{color:#60a5fa;}
.dl-btn-mini.locked{background:var(--faint);color:var(--muted);cursor:default;}
.dl-btn{width:100%;padding:9px 0;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s,transform .15s;font-family:'Space Grotesk',sans-serif;letter-spacing:0.3px;}
.dl-btn:hover{opacity:0.88;transform:scale(0.98);}
.dl-btn.primary{background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,0.25);}
.dl-btn.outline{background:transparent;color:#2563eb;border:1px solid rgba(37,99,235,0.35);}
body.dark .dl-btn.outline{color:#60a5fa;}
.dl-btn.locked{background:var(--faint);color:var(--muted);cursor:default;}
.dl-btn.locked:hover{opacity:1;transform:none;}

/* TRENDING STRIP */
.trending-wrap{position:relative;z-index:1;padding:2px 0 18px;}
.trending-scroll{display:flex;gap:12px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;max-width:680px;margin:0 auto;}
.trending-scroll::-webkit-scrollbar{display:none;}
.trend-card{scroll-snap-align:start;flex:0 0 158px;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;transition:transform .2s ease,border-color .2s;}
.trend-card:hover{transform:translateY(-3px);border-color:var(--border2);}
.trend-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;}
.trend-name{font-size:12.5px;font-weight:700;color:var(--tool-name);line-height:1.3;}
.trend-stats{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--muted);}
.trend-dl{width:100%;padding:7px 0;border-radius:8px;border:none;background:var(--glowsoft);color:#2563eb;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif;}
body.dark .trend-dl{color:#60a5fa;}

/* FEATURED CARD */
.tool-card.featured{grid-column:1/-1;flex-direction:row;align-items:center;padding:24px;gap:20px;background:var(--featured-bg);border-color:var(--featured-border);}
.tool-card.featured .card-top{flex-direction:column;gap:10px;flex-shrink:0;}
.featured-body{flex:1;min-width:0;}
.tool-desc{font-size:12px;color:var(--muted);line-height:1.55;}
.featured-body .tool-name{font-size:18px;margin-bottom:6px;}
.featured-body .tool-desc{font-size:13px;max-width:340px;}
.featured-actions{display:flex;gap:8px;flex-shrink:0;flex-direction:column;min-width:130px;}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-title{font-size:16px;font-weight:600;color:var(--muted);margin-bottom:6px;}
.empty-sub{font-size:13px;}

/* YOUTUBE */
.yt-section{position:relative;z-index:1;max-width:648px;margin:40px auto 0;padding:0 16px;}
.yt-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.yt-icon{width:36px;height:36px;background:#ff0000;border-radius:8px;display:grid;place-items:center;font-size:18px;flex-shrink:0;color:#fff;}
.yt-title{font-size:16px;font-weight:700;color:var(--yt-title);}
.yt-sub{font-size:12px;color:var(--muted);}
.yt-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,0,0,0.08);border:1px solid rgba(255,0,0,0.25);color:#dc2626;padding:10px 18px;border-radius:10px;text-decoration:none;font-size:13px;font-weight:700;transition:background .2s;font-family:'Space Grotesk',sans-serif;}
body.dark .yt-btn{color:#f87171;background:rgba(255,0,0,0.1);border-color:rgba(255,0,0,0.3);}
.yt-btn:hover{background:rgba(255,0,0,0.15);}
